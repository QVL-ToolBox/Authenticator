[package]
name = "authenticator-api"
version = "0.1.0"
license = "MIT"
edition = "2024"
description = "Service d'authentification prêt à l'emploi, assemblé sur la brique auth"
publish = false

[dependencies]
auth = { git = "https://github.com/QVL-ToolBox/TB-Api-Auth", tag = "v0.8.1" }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

# Argon2 optimisé même en debug : sinon chaque login prend plusieurs secondes avec cargo run.
[profile.dev.package.argon2]
opt-level = 3
